# realsense d405 configuration

device:
  serial_number: null  # null = use first available device
  visual_preset: 3     # 0=custom, 1=default, 2=hand, 3=high accuracy, 4=high density

streams:
  depth:
    width: 640
    height: 480
    fps: 30
    format: z16
  color:
    width: 640
    height: 480
    fps: 30
    format: bgr8

# post-processing filter chain
filters:
  decimation:
    enabled: true
    magnitude: 2
  spatial:
    enabled: true
    magnitude: 2
    smooth_alpha: 0.5
    smooth_delta: 20
  temporal:
    enabled: true
    smooth_alpha: 0.4
    smooth_delta: 20
    frames: 15  # number of frames for temporal averaging
  hole_filling:
    enabled: true

# capture settings
capture:
  warmup_frames: 30  # frames to discard for auto-exposure stabilization
  clipping:
    min_distance: 0.04  # meters (d405 min range)
    max_distance: 0.50  # meters (d405 optimal max for accuracy)

# .bag recording defaults
recording:
  duration: 5.0  # seconds
  output_dir: data/bags