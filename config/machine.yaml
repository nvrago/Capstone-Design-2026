# cnc machine configuration - genmitsu 3020 pro

serial:
  port: /dev/ttyUSB0
  baud_rate: 115200
  timeout: 2.0

# work envelope in mm
work_envelope:
  x: 300
  y: 200
  z: 60

# grbl settings reference (query with $$ command)
grbl:
  steps_per_mm:
    x: 800
    y: 800
    z: 800
  max_feed_rate:
    x: 1000
    y: 1000
    z: 500
  acceleration:
    x: 50
    y: 50
    z: 50

# safety limits
limits:
  soft_limits: true
  hard_limits: true
  homing_cycle: true