# Processing Configuration

# Point cloud processing
pointcloud:
  # Statistical outlier removal
  outlier_removal:
    nb_neighbors: 20
    std_ratio: 2.0
  # Voxel downsampling (set to null to disable)
  voxel_size: 0.5  # mm
  # Normal estimation
  normal_radius: 2.0  # mm

# Mesh reconstruction
mesh:
  # Method: poisson, ball_pivoting, or alpha_shape
  method: poisson
  poisson:
    depth: 9
    width: 0
    scale: 1.1
    linear_fit: false
  ball_pivoting:
    radii: [0.5, 1.0, 2.0]  # mm
  # Post-processing
  smooth_iterations: 1
  simplify_target: null  # target triangle count, null to disable

# Toolpath generation (OpenCAMLib)
toolpath:
  # Cutter definition
  cutter:
    type: cylindrical    # cylindrical, ball, bull
    diameter: 3.0        # mm
    length: 10.0         # mm
    # For bull cutter
    corner_radius: 0.0   # mm
  
  # Operation type
  operation: surface     # surface, waterline, or both
  
  # Surface (drop cutter) settings
  surface:
    stepover: 2.0        # mm between passes
    direction: x         # x, y, or both (crosshatch)
    
  # Waterline (contour) settings  
  waterline:
    z_step: 1.0          # mm between Z levels
    
  # Safety
  clearance_height: 10.0  # mm above highest point
  
# G-code output
gcode:
  feed_rate: 500         # mm/min for cutting
  plunge_rate: 100       # mm/min for Z moves
  spindle_speed: 1000   # RPM
  coolant: false
  # Post-processor style
  dialect: grbl          # grbl, linuxcnc, or generic

  # CAD-based apparatus masking (replaces dome subtraction when enabled)
cad_mask:
  enabled: true
  stl_path: data/reference/apparatus.STL
  scale: 0.001  # mm to meters
  origin_offset:
    x: -0.2773
    y: -0.3300
    z: -0.0945
  surface_threshold_m: 0.003  # 3mm from apparatus surfaces
  bounding_margin_m: 0.01     # 1cm slack on apparatus bbox
# TSDF volumetric fusion (selected via mesh.method: tsdf)
# replaces icp + poisson when enabled. per-pose depth frames are fused
# into a signed distance field, then marching cubes extracts the mesh.
mesh:
  tsdf:
    voxel_size_m: 0.001          # 1mm voxels
    sdf_trunc_m: 0.004           # 4mm truncation band (~4x voxel)
    depth_trunc_m: 0.5           # max depth per pixel
    cad_mask_depth: true         # option A: mask apparatus depth pre-integration
    mask_threshold_m: 0.010      # depth-mask distance tolerance
    cad_mask_post: false         # option B: mask cloud post-integration (+poisson)
    keep_largest_cluster: true   # dbscan filter to keep only the biggest cluster
    cluster_eps_m: 0.005
    cluster_min_points: 50
    visual_preset: 4             # d405 preset: 4=high_density (tsdf averages noise)
