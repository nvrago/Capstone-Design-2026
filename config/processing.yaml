# processing configuration

# ------------------------------------------------------------
# tsdf integration (stage 3 core)
# ------------------------------------------------------------
# voxel_size_m   1mm matches d405 close-range accuracy
# sdf_trunc_m    ~4 voxels of carving distance
# depth_trunc_m  0.5m matches d405 ideal range
# depth_scale    divisor applied to raw depth to get meters.
#                d405 default is 0.0001m/unit -> divisor 10000.
#                scanner queries the actual value at runtime and
#                overrides this unless the query fails.
tsdf:
  voxel_size_m: 0.001
  sdf_trunc_m: 0.004
  depth_trunc_m: 0.5
  depth_scale: 10000.0

# ------------------------------------------------------------
# plate-frame filtering (stage 3 post-tsdf)
# ------------------------------------------------------------
# xy_extent_m           +/- from plate center in x and y
# z_min_m               drop plate surface + noise (positive = above plate)
# z_max_m               maximum object height
# cluster_eps_m         dbscan neighborhood radius (5mm)
# cluster_min_points    minimum points in a valid cluster
clip:
  xy_extent_m: 0.100
  z_min_m: 0.010
  z_max_m: 0.100
  cluster_eps_m: 0.005
  cluster_min_points: 50

# ------------------------------------------------------------
# legacy point cloud processing (pre-tsdf pipeline)
# ------------------------------------------------------------
# these values are still read by PipelineConfig.from_yaml for
# backwards compat, but the tsdf pipeline ignores them. safe to
# leave or delete; kept for reference.
pointcloud:
  outlier_removal:
    nb_neighbors: 20
    std_ratio: 2.0
  voxel_size: 0.5  # mm
  normal_radius: 2.0  # mm

# ------------------------------------------------------------
# legacy mesh reconstruction (pre-tsdf pipeline)
# ------------------------------------------------------------
# tsdf uses marching cubes from the fused volume, so these are
# no-ops. kept for yaml backwards compat.
mesh:
  method: tsdf
  poisson:
    depth: 9
    width: 0
    scale: 1.1
    linear_fit: false
  ball_pivoting:
    radii: [0.5, 1.0, 2.0]  # mm
  smooth_iterations: 1
  simplify_target: null

# ------------------------------------------------------------
# toolpath generation (OpenCAMLib) — stage 5
# ------------------------------------------------------------
toolpath:
  cutter:
    type: cylindrical
    diameter: 3.0
    length: 10.0
    corner_radius: 0.0

  operation: surface

  surface:
    stepover: 2.0
    direction: x

  waterline:
    z_step: 1.0

  clearance_height: 10.0

# ------------------------------------------------------------
# g-code output — stage 5
# ------------------------------------------------------------
gcode:
  feed_rate: 500
  plunge_rate: 100
  spindle_speed: 1000
  coolant: false
  dialect: grbl